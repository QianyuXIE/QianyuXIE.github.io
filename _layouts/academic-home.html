<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta property="og:image" content="{{ '/img/Me/passport_photo.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{{ page.title | default: site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/img/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/academic-home.css' | relative_url }}">
</head>
<body class="academic-home">
  <header class="academic-header">
    <nav class="academic-nav" aria-label="Primary navigation">
      <a class="academic-brand" href="{{ '/' | relative_url }}">Qianyu Xie</a>
      <button class="academic-menu-toggle" type="button" aria-expanded="false" aria-controls="academic-menu">
        <span class="sr-only">Toggle navigation</span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
      <ul class="academic-menu" id="academic-menu">
        <li><a class="is-active" href="{{ '/' | relative_url }}" aria-current="page">Home</a></li>
        <li><a href="{{ '/moment.html' | relative_url }}">Moment</a></li>
        <li><a href="{{ '/about.html' | relative_url }}">About</a></li>
      </ul>
    </nav>
  </header>

  <main class="academic-shell">
    {{ content }}
  </main>

  <footer class="academic-footer">
    <p>&copy; {{ site.time | date: '%Y' }} Qianyu Xie. Powered by Jekyll and GitHub Pages.</p>
  </footer>

  <script>
    (function () {
      var button = document.querySelector('.academic-menu-toggle');
      var menu = document.querySelector('.academic-menu');
      if (!button || !menu) return;
      button.addEventListener('click', function () {
        var open = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!open));
        menu.classList.toggle('is-open', !open);
      });
    }());
  </script>
</body>
</html>
